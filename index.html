<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8>
    <title>Clara Choi's links</title>


    <style>
    * {
      border: 1px red dashed;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100%;
      padding-top: 40px;
      padding-bottom: 40px;
      background: linear-gradient(180deg, #1f005c, #5b0060, #870160, #ac255e, #ca485c, #e16b5c, #f39060, #ffb56b);
      color: rgba(255, 255, 255, 1.0);
    }

    .avatar-image {
      width: 128px;
      height: 128px;
      object-fit: cover;
      border-radius: 128px;
    }

    .thumbnail {
      width: 48px;
      height: 48px;
      border-radius: 48px;
      object-fit: cover;
    }

    a {
      color: rgba(255, 255, 255, 1.0);
    }

    .item {
      background-color: rgba(149, 123, 173, 0.5);
    }

  </style>
    
   </head>
  
  <body>
  <div class="main-container">
    <div class="image-row">
      <img src="Choi, Clara(Soobin).jpg" alt="Clara Choi headshot" class="avatar-image" >
    </div>

    <div class="name-row">
      Clara Choi
    </div>

    <div class="social-icons-row">
      
      <a href="https://www.linkedin.com/in/clarasoobinchoi/" target="_blank">
      Linkedin
      </a>
      <a href="https://www.instagram.com/sooobin__size/" target="_blank">
      Instagram
      </a>
    </div>

    <div class="links-row">

      <div class="item">
        <img src="logo-arxnimbus.png" alt="Arxnimbus Website" class="thumbnail">
        <a target="_blank" href="https://arxnimbus-demo.vercel.app/">
          ArxNimbus
        </a>
        </div>
     <div class="item">
        <img src="BKC.jpeg" alt="Booth Korea Club Portfolio" class="thumbnail">
        <a target="_blank" href="https://www.instagram.com/chicagoboothkorea/">
          Booth Korea Club
        </a>
      </div>

    
    </div> <!-- links-row -->
  </div> <!-- main-container -->
  </body>

</html>
